<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAM MENS WEAR | Member Sign In & Register</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="custom.css">
</head>

<body data-page="login">

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
        <!-- Brand -->
        <a class="brand-mark-wrapper" href="index.html">
            <div class="brand-logo-icon">R</div>
            <div>
                <span class="brand-title">RAM MENS WEAR</span>
                <span class="brand-subtitle">Atelier &bull; Menswear</span>
            </div>
        </a>

        <!-- Store Link -->
        <ul class="navbar-nav ms-auto align-items-center flex-row">
            <li class="nav-item">
                <a class="nav-link-custom" href="index.html">
                    <i class="bi bi-house-door"></i>
                    <span>Back to Store</span>
                </a>
            </li>
        </ul>
    </div>
</nav>

<!-- ================= MAIN CONTENT ================= -->
<main class="auth-page-container">
    <div class="auth-card-modern">
        <!-- Brand Monogram -->
        <div class="text-center mb-4">
            <div class="brand-logo-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.4rem;">R</div>
            <h1 class="h4 fw-bold mb-1">RAM MENS WEAR</h1>
            <p class="text-muted small">Welcome to our member portal</p>
        </div>

        <!-- Pill Tabs -->
        <div class="auth-tab-pill-box" role="group" aria-label="Authentication tabs">
            <button type="button" class="auth-tab-pill active" id="loginTab">Sign In</button>
        </div>

        <!-- Tab Panes -->
        <div class="tab-content">
            <!-- Sign In Pane -->
            <div class="tab-pane fade show active" id="loginPane" role="tabpanel">
                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label small fw-bold text-muted">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="loginEmail" placeholder="name@example.com" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="loginPassword" class="form-label small fw-bold text-muted mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 border-end-0" id="loginPassword" placeholder="Enter password" required>
                            <button type="button" class="input-group-text bg-light border-start-0 password-toggle-btn" data-target="loginPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-brand w-100 py-3">Sign In to Account</button>
                </form>
            </div>

            <div class="border-top mt-4 pt-4">
                <h2 class="h6 fw-bold mb-3">Create a customer account</h2>
                <form id="signupForm" novalidate>
                    <div class="mb-3">
                        <label for="signupName" class="form-label small fw-bold text-muted">Full Name</label>
                        <input type="text" class="form-control" id="signupName" placeholder="Your name" required>
                    </div>
                    <div class="mb-3">
                        <label for="signupEmail" class="form-label small fw-bold text-muted">Email Address</label>
                        <input type="email" class="form-control" id="signupEmail" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="signupPassword" class="form-label small fw-bold text-muted">Password</label>
                        <input type="password" class="form-control" id="signupPassword" minlength="6" placeholder="At least 6 characters" required>
                    </div>
                    <button type="submit" class="btn btn-outline-dark w-100">Create Account</button>
                </form>
            </div>

        </div>

        <p class="text-center text-muted mt-3 mb-0" style="font-size: .72rem;"><i class="bi bi-shield-lock me-1"></i>Your password is securely hashed by the server.</p>
    </div>
</main>

<!-- ================= FOOTER ================= -->
<footer class="footer-editorial py-4 text-center small text-muted">
    <div class="container">
        <div>&copy; 2026 RAM MENS WEAR. All Rights Reserved.</div>
    </div>
</footer>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="api-config.js"></script>
<script src="app.js"></script>
</body>

</html>
